spring.application.name=ebookstore
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ebookstore
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:YOUR_POSTGRES_PASSWORD}

# Tables are created by schema.sql, so Hibernate must not touch the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- JWT (secret must be at least 32 characters) ---
app.jwt.secret=change-this-demo-secret-to-something-long-and-random-123456
app.jwt.expiry-minutes=120
